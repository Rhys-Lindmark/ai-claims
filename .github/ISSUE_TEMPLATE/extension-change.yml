name: Extension change
description: Propose a bounded change to the open page truth layer.
title: "[Extension]: "
labels: [extension]
body:
  - type: markdown
    attributes:
      value: "AI Claims shows no score without complete reviewed evidence. Please map the proposed change before implementation."
  - type: dropdown
    id: boundary
    attributes:
      label: Architecture boundary
      options: [Detect, Canonicalize, Resolve, Gate, Show, Multiple boundaries]
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: What should become possible or clearer?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data movement
      description: List anything read, retained, or transmitted, including URL, title, entity key, page text, score, account data, and identifiers.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Source-policy implications
      description: Note transcript, Goodreads, or other acquisition changes; write “none” if unchanged.
    validations:
      required: true
  - type: textarea
    id: gate
    attributes:
      label: Publication-gate evidence
      description: How will tests prove that incomplete or unresolved work cannot expose a score?
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants
      options:
        - label: I will not add page-content transmission or scraping-shaped acquisition without a separate policy review.
          required: true
        - label: I will add or update deterministic contract tests.
          required: true
